name = "hardgame-api"
compatibility_date = "2026-10-03"

# Deploy the static site with Cloudflare Pages.
# This Worker configuration is intentionally separate so the same
# repository can host the API without putting secrets in the browser.

[[d1_databases]]
binding = "DB"
database_name = "hardgame"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
GAME_ENV = "development"
